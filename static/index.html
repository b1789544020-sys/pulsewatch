<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulseWatch · Linux 脉搏监控</title>
<style>
  :root {
    --bg: #0a0e1a; --card: #131a2e; --line: #233;
    --txt: #dbe6ff; --dim: #6b7ba3; --accent: #4dd7ff;
    --green: #3fe0a1; --yellow: #ffd166; --red: #ff6b81;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 70% -10%, #16224a 0%, var(--bg) 60%);
    color: var(--txt);
    font-family: "Cascadia Code", Consolas, "Microsoft YaHei", monospace;
    padding: 22px; min-height: 100vh;
  }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 14px; margin-bottom: 18px; }
  header h1 { font-size: 22px; letter-spacing: 2px; }
  header h1 .pulse { color: var(--accent); }
  header .meta { color: var(--dim); font-size: 13px; }
  .status { margin-left: auto; font-size: 13px; color: var(--green); }
  .status.down { color: var(--red); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .card {
    background: linear-gradient(180deg, #15203c 0%, var(--card) 100%);
    border: 1px solid #1f2b4d; border-radius: 12px; padding: 16px;
  }
  .card h3 { font-size: 12px; color: var(--dim); font-weight: normal;
             letter-spacing: 2px; margin-bottom: 10px; }
  .span2 { grid-column: span 2; }
  .span4 { grid-column: span 4; }
  .big { font-size: 40px; font-weight: 700; line-height: 1; }
  .big small { font-size: 15px; color: var(--dim); }
  .sub { color: var(--dim); font-size: 12px; margin-top: 8px; }
  canvas { width: 100%; display: block; }
  .bar { height: 10px; background: #0d1428; border-radius: 5px; overflow: hidden; margin-top: 10px; }
  .bar > div { height: 100%; border-radius: 5px; transition: width .5s;
               background: linear-gradient(90deg, var(--green), var(--accent)); }
  .bar > div.warn { background: linear-gradient(90deg, var(--yellow), #ff9f43); }
  .bar > div.crit { background: linear-gradient(90deg, var(--red), #ff4757); }
  .cores { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 10px; }
  .core { height: 26px; background: #0d1428; border-radius: 4px; position: relative; overflow: hidden; }
  .core > div { position: absolute; inset: 0; background: linear-gradient(90deg,#2b6cff,#4dd7ff);
                transform-origin: left; transform: scaleX(0); transition: transform .5s; }
  .core span { position: absolute; inset: 0; display: flex; align-items: center;
               justify-content: center; font-size: 10px; color: #cfe4ff; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #1c2745; }
  th { color: var(--dim); font-weight: normal; font-size: 11px; letter-spacing: 1px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .net-rx { color: var(--green); } .net-tx { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1><span class="pulse">●</span> PULSEWATCH</h1>
  <span class="meta" id="meta">连接中…</span>
  <span class="status" id="status">● LIVE</span>
</header>

<div class="grid">
  <!-- CPU -->
  <div class="card span2">
    <h3>CPU 使用率</h3>
    <div class="big"><span id="cpu">--</span><small>%</small></div>
    <canvas id="cpuChart" height="90"></canvas>
    <div class="cores" id="cores"></div>
  </div>

  <!-- 网络 -->
  <div class="card span2">
    <h3>网络流量</h3>
    <div style="display:flex; gap:24px;">
      <div><div class="big net-rx" style="font-size:26px" id="rx">0</div>
           <div class="sub">↓ 接收 /s</div></div>
      <div><div class="big net-tx" style="font-size:26px" id="tx">0</div>
           <div class="sub">↑ 发送 /s</div></div>
      <div style="margin-left:auto; font-size:12px; color:var(--dim); line-height:1.9" id="netTotal"></div>
    </div>
    <canvas id="netChart" height="120" style="margin-top:8px;"></canvas>
  </div>

  <!-- 内存 -->
  <div class="card">
    <h3>内存 MEMORY</h3>
    <div class="big"><span id="memPct">--</span><small>%</small></div>
    <div class="bar"><div id="memBar"></div></div>
    <div class="sub" id="memSub"></div>
  </div>

  <!-- 交换分区 -->
  <div class="card">
    <h3>交换分区 SWAP</h3>
    <div class="big"><span id="swapPct">--</span><small>%</small></div>
    <div class="bar"><div id="swapBar"></div></div>
    <div class="sub" id="swapSub"></div>
  </div>

  <!-- 磁盘 -->
  <div class="card">
    <h3>根磁盘 DISK /</h3>
    <div class="big"><span id="diskPct">--</span><small>%</small></div>
    <div class="bar"><div id="diskBar"></div></div>
    <div class="sub" id="diskSub"></div>
  </div>

  <!-- 系统信息 -->
  <div class="card">
    <h3>系统 SYSTEM</h3>
    <div style="font-size:13px; line-height:2;" id="sysInfo"></div>
  </div>

  <!-- Top 进程 -->
  <div class="card span4">
    <h3>最耗 CPU 的进程 TOP PROCESSES</h3>
    <table>
      <thead><tr><th class="num">PID</th><th>进程名</th>
      <th class="num">CPU %</th><th class="num">常驻内存 MB</th></tr></thead>
      <tbody id="procBody"></tbody>
    </table>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const fmtB = n => {
  if (n < 1024) return n + " B";
  const u = ["KB","MB","GB","TB"]; let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < 3);
  return n.toFixed(1) + " " + u[i];
};
const fmtUp = s => {
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  return (d?d+"天 ":"") + (h?h+"时 ":"") + m+"分";
};
const setBar = (barId, pct) => {
  const el = $(barId); el.style.width = pct + "%";
  el.className = pct >= 90 ? "crit" : pct >= 70 ? "warn" : "";
};

// ---- 通用折线图（自动适配高分屏）----
function drawChart(canvas, series, maxFixed, colors) {
  const dpr = window.devicePixelRatio || 1;
  // 设计高度只在第一次从 HTML 属性读取（90/120），之后锁定。
  // 注意：给 canvas.height 赋值会反向改写 HTML 属性，而 CSS 又没限定高度，
  // 若每次都重新读属性，高度会被 dpr 反复累乘 -> 画布无限变高。
  if (!canvas.dataset.designH) {
    canvas.dataset.designH = parseInt(canvas.getAttribute("height"), 10);
    canvas.style.height = canvas.dataset.designH + "px"; // 锁死显示高度
  }
  const h = parseInt(canvas.dataset.designH, 10);
  const w = canvas.clientWidth;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  let max = maxFixed || 1;
  if (!maxFixed) series.forEach(a => a.forEach(v => { if (v > max) max = v; }));
  // 网格
  ctx.strokeStyle = "#1c2745"; ctx.lineWidth = 1;
  for (let i = 1; i <= 3; i++) {
    const y = h * i / 4;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  series.forEach((data, si) => {
    if (data.length < 2) return;
    ctx.strokeStyle = colors[si]; ctx.lineWidth = 2;
    ctx.beginPath();
    data.forEach((v, i) => {
      const x = w * i / 59, y = h - (v / max) * (h - 6) - 3;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.stroke();
    // 末端微光圆点
    const lx = w * (data.length - 1) / 59;
    const ly = h - (data[data.length-1] / max) * (h - 6) - 3;
    ctx.fillStyle = colors[si];
    ctx.beginPath(); ctx.arc(lx, ly, 3, 0, 7); ctx.fill();
  });
}

const cpuHist = [], rxHist = [], txHist = [];
let coreBoxes = null;

async function tick() {
  try {
    const r = await fetch("/api/metrics");
    if (!r.ok) throw new Error("warming");
    const s = await r.json();
    $("status").textContent = "● LIVE"; $("status").classList.remove("down");

    $("meta").textContent = `${s.hostname} · ${s.os} · 内核 ${s.kernel}`;
    $("cpu").textContent = s.cpu_percent;
    $("memPct").textContent = s.mem.percent;
    $("swapPct").textContent = s.swap.percent;
    $("diskPct").textContent = s.disk.percent;
    setBar("memBar", s.mem.percent); setBar("swapBar", s.swap.percent);
    setBar("diskBar", s.disk.percent);
    $("memSub").textContent = `${fmtB(s.mem.used)} / ${fmtB(s.mem.total)}`;
    $("swapSub").textContent = s.swap.total ? `${fmtB(s.swap.used)} / ${fmtB(s.swap.total)}` : "未启用";
    $("diskSub").textContent = `已用 ${fmtB(s.disk.used)} · 剩余 ${fmtB(s.disk.free)}`;
    $("rx").textContent = fmtB(s.net.rx_rate);
    $("tx").textContent = fmtB(s.net.tx_rate);
    $("netTotal").innerHTML = `累计下载 ${fmtB(s.net.rx_total)}<br>累计上传 ${fmtB(s.net.tx_total)}`;
    $("sysInfo").innerHTML =
      `🖥 ${s.cpu_count} 核心<br>⏱ 运行 ${fmtUp(s.uptime_s)}<br>` +
      `📊 负载 ${s.loadavg.join(" / ")}`;

    // 每核心条（只建一次 DOM）
    if (!coreBoxes) {
      coreBoxes = s.per_cpu.map((_, i) => {
        const box = document.createElement("div"); box.className = "core";
        const fill = document.createElement("div");
        const label = document.createElement("span"); label.textContent = i;
        box.append(fill, label); $("cores").appendChild(box);
        return fill;
      });
    }
    s.per_cpu.forEach((v, i) => coreBoxes[i].style.transform = `scaleX(${v/100})`);

    // 历史曲线（保留 60 个点）
    cpuHist.push(s.cpu_percent); if (cpuHist.length > 60) cpuHist.shift();
    rxHist.push(s.net.rx_rate); if (rxHist.length > 60) rxHist.shift();
    txHist.push(s.net.tx_rate); if (txHist.length > 60) txHist.shift();
    drawChart($("cpuChart"), [cpuHist], 100, ["#4dd7ff"]);
    drawChart($("netChart"), [rxHist, txHist], null, ["#3fe0a1", "#4dd7ff"]);

    // 进程表
    $("procBody").innerHTML = s.procs.map(p =>
      `<tr><td class="num">${p.pid}</td><td>${p.name}</td>` +
      `<td class="num">${p.cpu.toFixed(1)}</td><td class="num">${p.mem_mb.toFixed(1)}</td></tr>`
    ).join("");
  } catch (e) {
    $("status").textContent = "● 等待数据"; $("status").classList.add("down");
  }
}
tick();
setInterval(tick, 1000);
window.addEventListener("resize", () => tick());
</script>

</body>
</html>
